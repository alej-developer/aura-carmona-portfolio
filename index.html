<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Carmona | Portfolio Alta Costura</title>
    
    <!-- 
      Content Security Policy (CSP) Estricto:
      - default-src 'self': Restringe todo el contenido al mismo origen por defecto.
      - script-src 'self': Bloquea scripts en línea (mitigación XSS) y carga solo desde el mismo origen.
      - style-src 'self': Bloquea estilos en línea y carga solo desde el mismo origen.
      - img-src 'self' data:: Permite imágenes locales y en formato base64.
      - object-src 'none': Bloquea la ejecución de plugins de terceros.
      - base-uri 'self': Restringe a dónde puede apuntar una etiqueta <base>.
      - form-action 'self': Evita el envío de formularios hacia otros dominios.
      - frame-ancestors 'none': Directiva moderna para evitar Clickjacking (equivalente a X-Frame-Options: DENY). 
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
    
    <!-- Prevención contra Clickjacking (Equivalente X-Frame-Options mediante metaetiqueta legacy) -->
    <meta http-equiv="X-Frame-Options" content="DENY">

    <!-- Asegurando que no se expongan API Keys ni configuraciones sensibles en cliente -->

    <meta name="description" content="Portafolio interactivo de la diseñadora de alta costura Aura Carmona. Elegancia, vanguardia y exclusividad.">
    <meta name="author" content="Aura Carmona">

    <!-- Enlace a estilos (siguiendo política de mismo origen 'self') -->
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="main-nav">
            <a href="#" class="brand-logo">Aura Carmona</a>
            <ul class="nav-links">
                <li><a href="#colecciones" class="nav-item">Colecciones</a></li>
                <li><a href="#filosofia" class="nav-item">Filosofía</a></li>
                <li><a href="#contacto" class="nav-item">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inicio" class="hero">
            <!-- Contenedor para vídeo o imagen de fondo (Desfile) -->
            <div class="hero-bg">
                <!-- Placeholder semántico: Usa un gradiente oscuro que respeta la directiva estricta CSP (img-src 'self') -->
                <div class="hero-bg-placeholder" role="img" aria-label="Fondo animado de pasarela y desfile de alta costura"></div>
            </div>

            <!-- Contenido Tipográfico de Alto Impacto -->
            <div class="hero-content">
                <!-- Aplicando las clases .runway-item que conectan con el motor JS de IntersectionObserver -->
                <h1 class="hero-title runway-item">Alta<br>Costura</h1>
                <p class="hero-subtitle runway-item delay-200">Redefiniendo la elegancia y la vanguardia en cada diseño.</p>
                <div class="runway-item delay-400">
                    <a href="#colecciones" class="hero-cta">Explorar Colección</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Enlace a script (siguiendo política de mismo origen 'self') -->
    <script src="./assets/js/main.js"></script>
</body>
</html>
